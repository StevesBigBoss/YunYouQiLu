{% load static %}
<html>
<head>
    <title>登录</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <script type="application/x-javascript">
         addEventListener("load", function() { setTimeout(hideURLbar, 0); }, false); function hideURLbar(){ window.scrollTo(0,1); }


    </script>
    <link rel="stylesheet" href="{% static 'css/style2.css' %}" type="text/css" media="all">

</head>


<body>


<h1>用户登录</h1>
<div class="container w3layouts agileits">
    <div>
        <h2 style="margin-left:45%">登 录</h2>
        <form action="/login_user/" method="post">
            {% csrf_token %}
            <input id="name"  type="text" name="name" placeholder="请输入用户名" required="">
            <input id="password" type="password" name="password" placeholder="请输入密码" required="">
            <div class="send-button w3layouts agileits">
                <input type="submit" value="登 录">
            </div>


        </form>
        <a href="/reg_user/">
            <div class="send-button w3layouts agileits">
                <input type="submit" value="注册">
            </div>
        </a>
        <div class="clear"></div>
    </div>

    <div class="clear"></div>
</div>

</body>
</html>
